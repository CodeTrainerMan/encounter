# ============================================================
# 本地开发用的 PostgreSQL
# 启动：docker compose up -d      停止：docker compose down
# 清空数据：docker compose down -v
#
# 端口映射到宿主机的 5433（避开本机可能已有的 5432），
# 对应连接串见 .env.example 中的本地开发示例。
# ============================================================
services:
  db:
    image: postgres:17-alpine
    container_name: encounter-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: encounter
      POSTGRES_PASSWORD: encounter
      POSTGRES_DB: encounter
    ports:
      - "5433:5432"
    volumes:
      - encounter-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U encounter -d encounter"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  encounter-db-data:
